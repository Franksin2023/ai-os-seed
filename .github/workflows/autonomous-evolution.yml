name: Autonomous AI Evolution

on:
  issues:
    types: [labeled]

jobs:
  evolve:
    if: github.event.label.name == 'agent:ready'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install openai PyGithub
          # Add any other dependencies your AI script needs

      - name: Run AI Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} # You will need to add this in Settings
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python scripts/ai_agent.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat: AI agent resolves issue #${{ github.event.issue.number }}"
          title: "AI Resolution for Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}"
          body: |
            This PR was automatically generated by the AI-OS Evolution Engine.

            **Task:** ${{ github.event.issue.title }}
            **Details:** ${{ github.event.issue.body }}

            *Please review the code and verify tests pass before merging.*
          branch: "ai/issue-${{ github.event.issue.number }}"
          base: "main"
