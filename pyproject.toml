[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-os-seed"
version = "0.1.0"
description = "An open evolutionary seed for an agent-friendly microkernel operating system."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Jules (AI Agent)" }
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
